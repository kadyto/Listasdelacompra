name: Comprobaciones
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:docker
      - name: Construir desde un archivo con la carpeta raíz de GitHub
        run: |
          git archive --format=tar --prefix=Listasdelacompra-main/ HEAD | docker build \
            --file Listasdelacompra-main/Dockerfile \
            --build-arg SOURCE_DIR=Listasdelacompra-main \
            --target production --tag listasdelacompra:archive-test -
